  --bg:#FBF6F0; --card:#FFFFFF; --ink:#3A2824; --muted:#7A625C; --rose:#B3475F; --rose-dark:#8E3349;
  --blush:#F8E3E6; --line:#EBD6D0; --chip:#E3CFC6; --gold:#C9973A; --gold-bg:#FBF0DA;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:transparent}
html,body{margin:0;color:var(--ink);font-family:Figtree,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
a{color:var(--rose)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:480px;margin:0 auto;min-height:100vh;position:relative}

/* Marca d'água */
.wm{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.wm::before,.wm::after{content:"";position:absolute;width:190px;height:234px;background:var(--leaf-l) center/contain no-repeat;opacity:.16}
.wm::before{left:-30px;bottom:-20px;transform:rotate(12deg)}
.wm::after{right:-30px;top:18%;background-image:var(--leaf-r);transform:rotate(-10deg)}

/* Cabeçalho */
.head{padding:14px 24px 16px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:136px;height:136px;border-radius:50%;background:#fff var(--logo) center/88% no-repeat;box-shadow:0 8px 22px rgba(179,71,95,.14),0 0 0 6px rgba(255,255,255,.55)}
.divider{display:flex;align-items:center;gap:6px;margin:8px 0 2px;color:#C98A99}
.divider i{width:70px;height:1.5px;background:#D9B7BE}
.divider svg{width:9px;height:9px}
.divider svg:nth-of-type(2){width:11px;height:11px}
.tagline{font:700 26px/1.1 Caveat,cursive;color:var(--rose);margin-top:2px}
.contacts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.contacts a{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1.5px solid var(--line);border-radius:999px;font:600 13px Figtree,sans-serif;color:var(--muted);text-decoration:none;background:var(--card)}
.contacts a:hover{border-color:var(--rose);color:var(--rose)}
.contacts svg{width:15px;height:15px;flex:none}


/* Abas */
.tabs{position:sticky;top:0;z-index:3;background:rgba(251,246,240,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;grid-template-columns:repeat(3,1fr);padding:4px 12px 0;border-bottom:1px solid var(--line)}
.tab{position:relative;border:0;background:none;padding:13px 2px 16px;cursor:pointer;font:400 16px/1 'Young Serif',serif;letter-spacing:.2em;text-indent:.2em;text-transform:uppercase;color:#957B74;transition:color .25s}
.tab[aria-selected="true"]{color:var(--rose)}
.tab:focus-visible{outline-offset:-4px;border-radius:10px}
/* Marcador da aba ativa: traço com coraçãozinho, como os divisores do Canva */
.tab-mark{position:absolute;left:12px;bottom:-1px;width:calc((100% - 24px) / 3);height:12px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--rose);pointer-events:none;transform:translateX(calc(var(--pos,0) * 100%));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.tab-mark::before,.tab-mark::after{content:"";width:22px;height:2px;border-radius:2px;background:currentColor}
.tab-mark svg{width:11px;height:11px;flex:none}
.tabs.dragging .tab-mark{transition:none}

/* Filtros de bolo */
.filters{display:flex;gap:6px;overflow-x:auto;padding:14px 20px 0;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters[hidden]{display:none}
.filter{flex:none;border:1px solid var(--chip);background:var(--card);font:500 13px Figtree,sans-serif;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--muted)}
.filter[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}

.note{padding:12px 24px 0;font:700 23px Caveat,cursive;color:var(--rose)}

/* Páginas (Bolos / Tortas / Doces) com deslizar do dedo */
.pager{overflow:hidden;overflow:clip}
#panel{touch-action:pan-y;will-change:transform}
.list{list-style:none;margin:0;padding:0 20px 20px}

/* Itens */
.item{position:relative;display:flex;gap:12px;align-items:flex-start;padding:14px 12px 14px 14px;margin:0 0 10px;background:var(--card);border:1.5px solid #F1E2D6;border-radius:18px;box-shadow:0 4px 14px rgba(58,40,36,.06)}

/* Sabor escolhido só no botão + (nos sabores dos doces, a linha toda responde ao toque) */
.item,.hero,.flv{-webkit-tap-highlight-color:transparent;transition:background-color .2s,border-color .2s,box-shadow .2s,border-radius .2s}
.flv{cursor:pointer}
.title{padding-right:44px}
.pick{position:absolute;top:12px;right:10px;width:34px;height:34px;padding:0;border-radius:50%;border:1.5px solid var(--chip);background:var(--card);color:var(--rose);display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s,color .15s}
button.pick{cursor:pointer}
button.pick:hover{border-color:var(--rose)}
/* Área de toque maior que o círculo (pelo menos 44×44) */
button.pick::before{content:"";position:absolute;inset:-6px;border-radius:50%}
.pick svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pick .check,.on>.pick .plus{display:none}
.on>.pick .check{display:block}
.on>.pick{background:var(--rose);border-color:var(--rose);color:#fff;animation:pickPop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pickPop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.item.on{border-color:var(--rose);box-shadow:0 6px 18px rgba(179,71,95,.14)}
.hero.on{border-color:var(--rose);box-shadow:0 0 0 1.5px var(--rose),0 10px 26px rgba(179,71,95,.18)}
.hero .pick{top:16px;right:16px;width:38px;height:38px;z-index:1}
@media (prefers-reduced-motion:reduce){.on>.pick{animation:none}}

/* Doces com vários sabores: abre e fecha, e cada sabor é escolhido separado */
.more .thumb{margin-right:2px}
.more{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.more .name{flex:1}
.count{font:500 13px Figtree,sans-serif;color:var(--muted);white-space:nowrap}
.has .count{color:var(--rose);font-weight:700}
.chev{flex:none;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.open .chev{transform:rotate(180deg)}
.flavors{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.flavors[hidden]{display:none}
.flv{position:relative;display:flex;align-items:center;min-height:44px;padding:8px 52px 8px 14px;border:1.5px solid var(--line);border-radius:14px;background:#FDFAF7;font-size:15px}
.flv .pick{top:50%;right:6px;margin-top:-15px;width:30px;height:30px}
.flv.on{border-color:var(--rose);box-shadow:0 4px 12px rgba(179,71,95,.12)}
.body{flex:1;min-width:0}
.title{display:flex;align-items:center;gap:10px}
.name{margin:0;font:400 19px/1.25 'Young Serif',serif;color:var(--ink)}
.spec{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:14px;line-height:1.45;color:var(--muted)}
.spec dt{font-weight:700;color:var(--ink)}
.spec dd{margin:0;text-wrap:pretty}
.desc{margin:4px 0 0;font-size:14px;line-height:1.45;color:var(--muted)}

/* Selos (mesmo formato do cardápio do Canva) */
.seal{flex:none;width:48px;height:48px;filter:drop-shadow(0 2px 3px rgba(138,100,32,.25))}
.seal text{font:700 25px 'Mountains of Christmas',Figtree,serif;fill:#fff;paint-order:stroke;stroke:#9A6E22;stroke-width:1.4px;stroke-linejoin:round}
.ribbon{display:block;height:38px;width:auto;margin:0 0 10px -6px;filter:drop-shadow(0 2px 3px rgba(142,51,73,.25))}
.ribbon text{font:700 14px 'Mountains of Christmas',Figtree,serif;letter-spacing:.9px;fill:#fff}

/* Bolo assinatura */
.hero{position:relative;margin:10px 0 8px;padding:20px 20px 18px;border-radius:22px;background:linear-gradient(160deg,#fff 0%,#FDF3F4 55%,var(--blush) 100%);border:1.5px solid #EBC3CB;box-shadow:0 10px 26px rgba(179,71,95,.12);overflow:hidden}
.hero::after{content:"";position:absolute;right:-10px;bottom:-20px;width:120px;height:150px;background:var(--leaf-r) center/contain no-repeat;opacity:.35;transform:rotate(-8deg);pointer-events:none}
.hero .kicker{margin:0;font:700 22px/1 Caveat,cursive;color:var(--rose)}
.hero .name{font-size:30px;margin-top:2px}
.hero .spec{font-size:15px;margin-top:10px;position:relative;z-index:1}
.hero-top{display:flex;align-items:center;gap:8px}
.hero-top .name{flex:1;min-width:0}

/* Ilustração provisória do bolo (até as fotos ficarem prontas) */
.thumb{position:relative;flex:none;width:64px;height:64px;border-radius:16px;background:#FBF1EE;display:flex;align-items:center;justify-content:center}
.thumb svg.cake{width:60px;height:60px}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
/* Foto que amplia ao toque */
.zoom{display:block;width:100%;height:100%;padding:0;border:0;border-radius:inherit;background:none;cursor:zoom-in}
/* Fotos com a mesma moldura: borda branca e sombra suave */
.thumb:has(img){background:#fff;box-shadow:0 0 0 2px #fff,0 4px 12px rgba(58,40,36,.16)}
.thumb .seal{position:absolute;left:-12px;top:-12px;width:34px;height:34px}
.hero .thumb{width:92px;height:92px;margin:-10px -4px -6px 0;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 0 3px #fff,0 6px 16px rgba(179,71,95,.2)}
.hero .thumb svg.cake{width:86px;height:86px}
.ilus{padding:4px 0 0;text-align:center;font-size:12px;color:var(--muted);opacity:.8}

/* Novidades */
.item.card .name{font-size:20px}
.list{padding-top:4px}

.group{display:flex;align-items:center;gap:12px;padding:18px 0 8px;font:600 12px Figtree,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.group::before,.group::after{content:"";flex:1;height:1px;background:var(--line)}
.group-note{margin:-2px 0 10px;text-align:center;font:600 13px Figtree,sans-serif;color:var(--rose)}
.line-hint{margin:2px 0 0;font:600 12px Figtree,sans-serif;color:var(--muted)}

/* Tortas e doces: lista mais enxuta, pra deixar o protagonismo com os bolos */
.list.compact .item{padding:12px 12px 12px 16px}
.list.compact .name{font-size:17px}
.list.compact .item:not(.multi)>.pick{top:50%;margin-top:-17px}
.list.compact .item:not(.multi){align-items:center;min-height:62px}


.empty{padding:24px;text-align:center;color:var(--muted);font-size:14px}

/* Rodapé */
.foot{padding:28px 24px 110px;text-align:center}
.thanks{font:700 27px Caveat,cursive;color:var(--rose)}

/* Barra de pedido */
.cta{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:center;padding:14px 16px 18px;background:linear-gradient(rgba(251,246,240,0),var(--bg) 30%)}
.cta-inner{width:100%;max-width:448px}
/* Botão do pedido: sempre à mostra; secundário com 0 itens, rosa cheio com 1 ou mais */
.btn{width:100%;height:56px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--rose);display:flex;align-items:center;justify-content:center;gap:10px;font:700 16px Figtree,sans-serif;white-space:nowrap;cursor:pointer;box-shadow:0 6px 16px rgba(58,40,36,.1);transition:background-color .2s,border-color .2s,color .2s,box-shadow .2s}
.btn:hover{border-color:var(--rose)}
.btn.fill{background:var(--rose);border-color:var(--rose);color:#fff;box-shadow:0 8px 20px rgba(179,71,95,.35)}
.btn.fill:hover{background:var(--rose-dark);border-color:var(--rose-dark)}
.btn svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-n{display:inline-block}
.btn-n:empty{display:none}
.btn-n.bump{animation:pickPop .35s cubic-bezier(.3,1.6,.5,1)}
@media (prefers-reduced-motion:reduce){.btn-n.bump{animation:none}}
.wa{height:56px;border-radius:999px;background:var(--rose);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font:700 16px Figtree,sans-serif;text-decoration:none;box-shadow:0 8px 20px rgba(179,71,95,.35)}
.wa:hover{background:var(--rose-dark);color:#fff}
.wa svg{width:22px;height:22px}

/* Carrinho: folha que sobe de baixo para ver e editar o pedido */
html:has(.cart[open]){overflow:hidden}
.cart{position:fixed;inset:auto 0 0;width:100%;max-width:480px;max-height:90vh;max-height:90dvh;margin:0 auto;padding:0;border:0;border-radius:24px 24px 0 0;background:var(--bg);color:var(--ink);box-shadow:0 -10px 40px rgba(58,40,36,.2);flex-direction:column;overflow:hidden}
.cart[open]{display:flex;animation:cartUp .32s cubic-bezier(.2,.8,.2,1)}
.cart::backdrop{background:rgba(58,40,36,.45)}
@keyframes cartUp{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){.cart[open]{animation:none}}
.cart-head{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px 12px 20px;border-bottom:1px solid var(--line)}
.cart-head::before{content:"";position:absolute;left:50%;top:7px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--chip)}

.cart-head h2 small{display:block;font:500 13px Figtree,sans-serif;color:var(--muted)}
.cart-close{flex:none;margin-top:10px;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.cart-close svg,.line-del svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cart-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 18px}
.cart-list{list-style:none;margin:0;padding:0}
.cart-body .group{padding-top:16px}
.line{display:flex;gap:12px;padding:12px;margin-bottom:8px;background:var(--card);border:1.5px solid #F1E2D6;border-radius:16px;box-shadow:0 3px 10px rgba(58,40,36,.05)}
.line .thumb{width:54px;height:54px;border-radius:14px}

.line-main{flex:1;min-width:0}
.line-top{display:flex;align-items:flex-start;gap:6px}

.chip[aria-pressed="true"]{border-color:var(--rose);background:var(--blush);color:var(--rose-dark);font-weight:600}
.add-note{margin-top:4px;border:0;background:none;padding:4px 0;color:var(--rose);font:600 13px Figtree,sans-serif;cursor:pointer}
.field{display:block;width:100%;margin-top:8px;padding:9px 11px;border:1.5px solid var(--line);border-radius:12px;background:#FDFAF7;font:15px/1.4 Figtree,sans-serif;color:var(--ink);resize:vertical}

  mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Cpath%20d%3D%27M12%2021s-7.5-4.6-9.6-9.2C.9%208.4%202.9%204.5%206.6%204.5c2.2%200%203.7%201.2%205.4%203.1%201.7-1.9%203.2-3.1%205.4-3.1%203.7%200%205.7%203.9%204.2%207.3C19.5%2016.4%2012%2021%2012%2021z%27/%3E%3C/svg%3E") center/0 0 no-repeat exclude,linear-gradient(#000 0 0);
  animation:spOpen .9s cubic-bezier(.55,0,.35,1) 2.9s forwards}
/* Saída: um coração se abre do centro e mostra o cardápio */
@keyframes spOpen{0%{-webkit-mask-size:0 0,100% 100%;mask-size:0 0,100% 100%}99%{opacity:1}100%{-webkit-mask-size:330vmax 330vmax,100% 100%;mask-size:330vmax 330vmax,100% 100%;opacity:0;visibility:hidden}}
.splash.skip{animation:spOpen .55s cubic-bezier(.55,0,.35,1) forwards}

  }
  MENU.forEach(c => {
    const b = $('tab-' + c.id), on = c.id === state.tab;
    b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1;
  });
  tabs.style.setProperty('--pos', tabIndex());
  $('panel').setAttribute('aria-labelledby', 'tab-' + state.tab);
}

function renderFilters() {
  const show = state.tab === 'bolos';

}

function spec(it) {
  const rows = [];
  if (it.m) rows.push(['Massa', it.m]);
  if (it.r) rows.push(['Recheio', it.r]);
  if (it.c) rows.push(['Cobertura', it.c]);
  if (it.rc) rows.push(['Recheio e cobertura', it.rc]);
  if (!rows.length) return it.d ? `<p class="desc">${esc(it.d)}</p>` : '';
  return `<dl class="spec">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
}

function renderList() {
  const cat = MENU.find(c => c.id === state.tab);
  let items = cat.items;
  if (cat.id === 'bolos' && state.filter !== 'todos') {
    items = items.filter(it => state.filter === 'new' ? it.tag === 'new' : it.massa === state.filter);
  }
  $('note').textContent = cat.note;
  $('list').classList.toggle('compact', cat.id !== 'bolos');
  // Na visão "Todos" dos bolos: assinatura em destaque, depois novidades e clássicos
  // (só quando a lista segue essa ordem; se as novidades estiverem no meio dos clássicos, sem títulos)
  const rank = it => it.tag === 'sig' ? 0 : it.tag === 'new' ? 1 : 2;
  const grouped = cat.id === 'bolos' && state.filter === 'todos' && items.every((it, i) => !i || rank(items[i - 1]) <= rank(it));
  let html = '';
  items.forEach((it, i) => {
    const prev = items[i - 1];
    if (grouped && it.tag === 'new' && (!prev || prev.tag !== 'new')) html += '<li class="group">Novidades</li>';
    if (grouped && !it.tag && prev && prev.tag) html += '<li class="group">Clássicos da casa</li>';
    if (it.g && (!prev || prev.g !== it.g)) {
      html += `<li class="group">${esc(it.g)}</li>`;
      if (GRUPO_NOTA[it.g]) html += `<li class="group-note">${esc(GRUPO_NOTA[it.g])}</li>`;
    }
    html += itemHtml(cat, it);

// Imagem de cada sabor: foto do bolo ou da torta, desenho da torta ou do doce
function artHtml(cat, it) {
  const src = fotoSrc(cat, it);
  if (src) return `<img src="${src}" alt="" loading="lazy" width="256" height="256">`;
  if (cat.id === 'tortas' && TORTA[it.n]) return tortaSvg(TORTA[it.n]);
  if (cat.id === 'doces' && DOCE[it.n]) return DOCE[it.n]();
  return '';
}
const ART_NOTE = { bolos: 'Fotos de bolos da Dona Sil — a decoração varia a cada encomenda.', tortas: 'Fotos da Dona Sil e imagens ilustrativas.', doces: 'Imagens ilustrativas.' };

const PICK_ICONS = '<svg class="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><svg class="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
// Sabores dos doces: a linha inteira é o botão, o + é só desenho
const PICK = `<span class="pick" aria-hidden="true">${PICK_ICONS}</span>`;
// Nome para leitor de tela: "bolo Nutella", "torta Café", "Brownie"
const spoken = (cat, it) => cat.id === 'bolos' ? (/^bolo /i.test(it.n) ? 'b' + it.n.slice(1) : 'bolo ' + it.n)
  : cat.id === 'tortas' ? 'torta ' + it.n : it.n;
const pickLabel = (cat, it, on) => on ? `Tirar ${spoken(cat, it)} do pedido` : `Escolher ${spoken(cat, it)}`;
// Bolos, tortas e doces: só o + escolhe ou tira
const pickBtn = (cat, it, key, on) =>
  `<button class="pick" type="button" aria-pressed="${on}" aria-label="${esc(pickLabel(cat, it, on))}" data-key="${esc(key)}">${PICK_ICONS}</button>`;
// Foto do bolo ou da torta: tocar amplia
// "da torta Palmito", "do bolo Nutella"
const daSabor = (cat, it) => (cat.id === 'tortas' ? 'da ' : 'do ') + spoken(cat, it);
// Com mais de uma foto, o cartão avisa quantas são
const zoomHtml = (cat, it, key, img) => {
  const n = fotosDe(cat, it).length;
  if (!n) return img;
  const label = n > 1 ? `Ver as ${n} fotos ${daSabor(cat, it)}` : `Ampliar foto ${daSabor(cat, it)}`;
  const badge = n > 1 ? `<span class="fotos-n" aria-hidden="true">${n} fotos</span>` : '';
  return `<button class="zoom" type="button" aria-label="${esc(label)}" data-zoom="${esc(key)}">${img}${badge}</button>`;
};
const CHEV = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
const keyOf = (cat, it) => cat.id + ':' + it.n;

function itemHtml(cat, it) {
  const key = keyOf(cat, it), on = state.picked.has(key);
  if (it.sabores) return multiHtml(cat, key, it);
  const pick = pickBtn(cat, it, key, on);
  const img = zoomHtml(cat, it, key, artHtml(cat, it));
  const art = img ? `<div class="thumb">${img}${it.tag === 'new' ? SEAL_NEW : ''}</div>` : (it.tag === 'new' ? SEAL_NEW : '');
  if (it.tag === 'sig') {
    return `<li class="hero${on ? ' on' : ''}">
      ${pick}${RIBBON_SIG}
      <p class="kicker">o bolo que leva o meu nome</p>
      <div class="hero-top"><h3 class="name">${esc(it.n)}</h3>${img ? `<div class="thumb">${img}</div>` : ''}</div>${spec(it)}
    </li>`;
  }
  return `<li class="item${it.tag === 'new' ? ' card' : ''}${on ? ' on' : ''}">
      ${pick}<div class="body"><div class="title">${art}<h3 class="name">${esc(it.n)}</h3></div>${spec(it)}</div>
    </li>`;
}

function multiHtml(cat, key, it) {
  const img = artHtml(cat, it);
  const open = state.open.has(key), total = it.sabores.length;
  const n = it.sabores.filter(s => state.picked.has(key + ':' + s)).length;
  const count = n ? `${n} escolhido${n > 1 ? 's' : ''}` : `${total} sabores`;
  return `<li class="item multi${open ? ' open' : ''}${n ? ' has' : ''}">
      <div class="body">
        <button class="more" type="button" aria-expanded="${open}" data-open="${esc(key)}">${img ? `<span class="thumb">${img}</span>` : ''}<span class="name">${esc(it.n)}</span><span class="count">${count}</span>${CHEV}</button>
        <ul class="flavors"${open ? '' : ' hidden'}>${it.sabores.map(s => {
          const k = key + ':' + s, on = state.picked.has(k);
          return `<li class="flv${on ? ' on' : ''}" role="button" tabindex="0" aria-pressed="${on}" aria-label="Escolher ${esc(it.n)}: ${esc(s)}" data-key="${esc(k)}">${PICK}${esc(s)}</li>`;
        }).join('')}</ul>
      </div>
    </li>`;
}

// Escolhidos na ordem do cardápio, agrupados por categoria (para o resumo, o carrinho e a mensagem).
// Cada linha é um item; os doces com vários sabores viram uma linha só, com os sabores escolhidos.
function pickedByCat() {
  return MENU.map(cat => ({ cat, lines: cat.items.flatMap(it => {
    const key = keyOf(cat, it);
    if (!it.sabores) return state.picked.has(key) ? [{ key, it, label: it.rotulo || it.n }] : [];
    const s = it.sabores.filter(f => state.picked.has(key + ':' + f));
    return s.length ? [{ key, it, flavors: s, label: `${it.n} (${s.join(', ')})` }] : [];
  }) })).filter(g => g.lines.length);
}

const noteOf = key => (state.notes[key] || '').trim();

function waMessage(groups) {
  if (!state.picked.size) return 'Oi Dona Sil! Vi o cardápio e queria fazer uma encomenda.';
  const order = state.orderNote.trim();
  return 'Oi Dona Sil! Vi o cardápio e queria encomendar:\n'
    + groups.map(g => `\n${g.cat.name}\n` + g.lines.map(l => '• ' + l.label + (noteOf(l.key) ? ' — ' + noteOf(l.key) : '')).join('\n')).join('\n')

}

const waLink = text => 'https://wa.me/' + PHONE + '?text=' + encodeURIComponent(text);

function renderCta() {
  const groups = pickedByCat(), n = state.picked.size;

  const count = n ? `(${n})` : '';

  $('picked').classList.toggle('fill', n > 0);
  $('picked').setAttribute('aria-label', `Ver meu pedido (${label})`);
  // Aviso para leitor de tela quando a quantidade muda (não no carregamento da página)
  if (renderCta.done) $('pickedText').textContent = `Pedido: ${label}`;
  renderCta.done = true;

// ---- Carrinho: ver e editar os escolhidos ----
const TRASH = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1.5 1.5 0 0 0 1.5 1.4h7A1.5 1.5 0 0 0 17 19l1-12M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';

function lineHtml(cat, l) {
  const img = artHtml(cat, l.it), k = esc(l.key), note = state.notes[l.key] || '';
  const chips = l.it.sabores ? `<div class="chips" role="group" aria-label="Sabores de ${esc(l.it.n)}">${l.it.sabores.map(s => {
    const on = state.picked.has(l.key + ':' + s);

  }).join('')}</div>` : '';

    ? `<textarea class="field" rows="1" data-note="${k}" aria-label="Observação para ${esc(l.it.n)}" placeholder="Ex.: tamanho, quantidade, sem açúcar…">${esc(note)}</textarea>`

      ${img ? `<div class="thumb">${img}</div>` : ''}
      <div class="line-main">
        <div class="line-top"><h3 class="line-name">${esc(l.it.rotulo || l.it.n)}</h3><button class="line-del" type="button" data-remove="${k}" aria-label="Tirar ${esc(l.it.n)} do pedido">${TRASH}</button></div>
        ${GRUPO_NOTA[l.it.g] ? `<p class="line-hint">${esc(GRUPO_NOTA[l.it.g])}</p>` : ''}${chips}${noteHtml}
      </div>
    </li>`;
}

function renderCart() {
  const groups = pickedByCat(), n = state.picked.size;
  $('cartCount').textContent = n ? `${n} ${n === 1 ? 'sabor escolhido' : 'sabores escolhidos'}` : '';
  $('cartBody').innerHTML = n
    ? '<ul class="cart-list">' + groups.map(g => `<li class="group">${g.cat.name}</li>` + g.lines.map(l => lineHtml(g.cat, l)).join('')).join('') + '</ul>'
      + `<div class="order-note"><label for="orderNote">Alguma observação pro pedido?</label>
        <textarea class="field" id="orderNote" rows="2" placeholder="Ex.: para sábado, retirada às 15h">${esc(state.orderNote)}</textarea></div>

    : `<div class="cart-empty"><div class="thanks">Seu pedido está vazio</div><p>Toque no + dos sabores que quiser e eles aparecem aqui.</p><button class="back" type="button" data-close>Voltar ao cardápio</button></div>`;
  $('cartBody').querySelectorAll('textarea').forEach(fit);
}

// Campo de texto cresce junto com o que a pessoa escreve
function fit(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 3 + 'px'; }

// Redesenha o carrinho (e o cardápio por baixo) mantendo o foco onde faz sentido
function refreshCart(sel) {
  renderList(); renderCta(); renderCart();
  const el = sel && $('cartBody').querySelector(sel);
  (el || $('cartBody').querySelector('.line-del, .back') || $('cartTitle')).focus();
}

const cart = $('cart');
// Rodapé: contato para dúvidas, sem depender do pedido montado
$('waFoot').href = waLink('Oi Dona Sil! Vi o cardápio e queria tirar uma dúvida.');
function openCart() { state.noteOpen.clear(); cart.showModal(); layerOpened('cart'); renderCart(); $('cartTitle').focus(); }
$('picked').addEventListener('click', openCart);
$('cartClose').addEventListener('click', () => cart.close());
cart.addEventListener('close', () => layerClosed('cart'));
// Toque fora da folha (no fundo escurecido) também fecha
cart.addEventListener('click', e => { if (e.target === cart) cart.close(); });

$('cartBody').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.close !== undefined) { cart.close(); return; }
  if (t.id === 'cartClear') {
    if (!confirm('Tirar todos os sabores do pedido?')) return;
    state.picked.clear(); state.notes = {}; state.orderNote = ''; refreshCart(); return;
  }
  if (t.dataset.remove) {
    const key = t.dataset.remove, li = t.closest('.line'), next = li.nextElementSibling || li.previousElementSibling;
    const nextKey = next && next.querySelector('[data-remove]') && next.querySelector('[data-remove]').dataset.remove;
    [...state.picked].forEach(k => { if (k === key || k.startsWith(key + ':')) state.picked.delete(k); });
    delete state.notes[key];
    refreshCart(nextKey && `[data-remove="${CSS.escape(nextKey)}"]`); return;
  }
  if (t.dataset.flavor) {
    const k = t.dataset.flavor, base = k.slice(0, k.lastIndexOf(':'));
    if (!state.picked.delete(k)) state.picked.add(k);
    if (![...state.picked].some(p => p.startsWith(base + ':'))) delete state.notes[base];
    refreshCart(`[data-flavor="${CSS.escape(k)}"]`); return;
  }
  if (t.dataset.addNote) {
    state.noteOpen.add(t.dataset.addNote);
    refreshCart(`[data-note="${CSS.escape(t.dataset.addNote)}"]`);
  }
});
// Observações: só atualizam a mensagem, sem redesenhar (para não perder o que está sendo digitado)
$('cartBody').addEventListener('input', e => {

});

// ---- Pedido guardado no aparelho, para não sumir se a página recarregar ----
const STORE = 'donasil-pedido';
function save() {
  try {
    localStorage.setItem(STORE, JSON.stringify({ picked: [...state.picked], notes: state.notes, orderNote: state.orderNote }));
  } catch (e) {}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE) || 'null'); if (!d) return;
    // Só aceita sabores que ainda existem no cardápio
    const valid = new Set(MENU.flatMap(cat => cat.items.flatMap(it => {
      const key = keyOf(cat, it);
      return it.sabores ? it.sabores.map(s => key + ':' + s) : [key];
    })));
    (d.picked || []).forEach(k => { if (valid.has(k)) state.picked.add(k); });
    Object.entries(d.notes || {}).forEach(([k, v]) => { if (typeof v === 'string' && v.trim()) state.notes[k] = v; });
    if (typeof d.orderNote === 'string') state.orderNote = d.orderNote;
  } catch (e) {}
}

function render() { renderTabs(); renderFilters(); renderList(); renderCta(); }

// ---- Troca de página (abas, botões e deslizar do dedo) ----
const panel = $('panel');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
let busy = false;

// Se a pessoa já desceu a página, a nova página começa logo abaixo das abas
function toPanelTop() {
  const top = panel.getBoundingClientRect().top + scrollY - $('tabs').offsetHeight;
  if (scrollY > top) scrollTo(0, top);
}

// fromHistory: a troca veio do "voltar" do celular, então não mexe no histórico
function show(i, fromHistory) {
  state.tab = MENU[i].id; state.filter = 'todos'; render(); $('filters').scrollLeft = 0; toPanelTop();
  if (!fromHistory) tabHistory(state.tab);
}

function slide(to, css) {
  panel.style.transition = css;
  panel.style.transform = to ? `translateX(${to})` : '';
  panel.style.opacity = to ? '0' : '';
}

// dir: 1 = próxima página (entra pela direita), -1 = anterior
function goTo(i, dir, fromHistory) {
  const cur = tabIndex();
  if (busy || i === cur || i < 0 || i >= MENU.length) { slide('', 'transform .25s ease, opacity .25s'); $('tabs').style.setProperty('--pos', cur); return; }
  dir = dir || (i > cur ? 1 : -1);
  $('tabs').style.setProperty('--pos', i);
  if (reduceMotion.matches) { slide('', 'none'); show(i, fromHistory); return; }
  busy = true;
  slide(`${-dir * 100}%`, 'transform .2s ease-in, opacity .2s ease-in');
  setTimeout(() => {
    show(i, fromHistory);
    slide(`${dir * 35}%`, 'none');
    panel.getBoundingClientRect();
    slide('', 'transform .3s cubic-bezier(.2,.8,.2,1), opacity .3s');
    setTimeout(() => { busy = false; }, 300);
  }, 200);
}

let drag = null;
panel.addEventListener('touchstart', e => {
  if (busy || e.touches.length > 1 || e.target.closest('.filters')) { drag = null; return; }
  const t = e.touches[0];
  // w: largura da página medida uma vez, para não recalcular o layout a cada movimento do dedo
  drag = { x: t.clientX, y: t.clientY, t: Date.now(), dx: 0, axis: null, w: panel.offsetWidth };
}, { passive: true });
panel.addEventListener('touchmove', e => {
  if (!drag) return;
  const t = e.touches[0], dx = t.clientX - drag.x, dy = t.clientY - drag.y;
  if (!drag.axis) {
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    drag.axis = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'x' : 'y';
  }
  if (drag.axis !== 'x') return;
  const i = tabIndex(), edge = (dx > 0 && i === 0) || (dx < 0 && i === MENU.length - 1);
  drag.dx = edge ? dx * 0.25 : dx;
  panel.style.transition = 'none';
  panel.style.transform = `translateX(${drag.dx}px)`;
  $('tabs').classList.add('dragging');
  $('tabs').style.setProperty('--pos', i - drag.dx / drag.w);
  panel.style.opacity = String(1 - Math.min(Math.abs(drag.dx) / drag.w, 1) * 0.5);
}, { passive: true });
function endDrag() {
  if (!drag || drag.axis !== 'x') { drag = null; return; }
  const { dx, t, w } = drag; drag = null;
  $('tabs').classList.remove('dragging');
  const fast = Math.abs(dx) / (Date.now() - t) > 0.45 && Math.abs(dx) > 30;
  if (Math.abs(dx) > w * 0.22 || fast) {
    const dir = dx < 0 ? 1 : -1;
    goTo(tabIndex() + dir, dir);
  } else {
    slide('', 'transform .25s ease, opacity .25s');
    $('tabs').style.setProperty('--pos', tabIndex());
  }
}
panel.addEventListener('touchend', endDrag);
panel.addEventListener('touchcancel', endDrag);

$('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  goTo(MENU.findIndex(c => c.id === b.dataset.tab));
});
$('tabs').addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const i = tabIndex();
  show((i + (e.key === 'ArrowRight' ? 1 : MENU.length - 1)) % MENU.length); $('tab-' + state.tab).focus();
});
// Redesenha a lista mantendo o foco no item que a pessoa usou (teclado)
function refresh(sel) {
  const focused = document.activeElement && $('list').contains(document.activeElement);
  renderList(); renderCta();
  if (focused) { const el = $('list').querySelector(sel); if (el) el.focus(); }
}
function togglePick(el) {
  const key = el.dataset.key;
  if (!state.picked.delete(key)) state.picked.add(key);
  refresh(`[data-key="${CSS.escape(key)}"]`);
}

// ---- Foto ampliada do bolo ----
const viewer = $('viewer');
let viewing = null;
// Fotos do sabor aberto, qual está à mostra e o texto alternativo base
let viewFotos = [], viewIdx = 0, viewAlt = '';
function renderViewer() {
  const on = state.picked.has(viewing);
  $('viewerPick').textContent = on ? 'Tirar do pedido' : 'Escolher este sabor';
  $('viewerPick').classList.toggle('fill', !on);

function openViewer(key) {

// Mostra a foto i (dá a volta nas pontas); announce avisa o leitor de tela "Foto 2 de 3"
function showFoto(i, announce = true) {

$('viewerPrev').addEventListener('click', () => showFoto(viewIdx - 1));
$('viewerNext').addEventListener('click', () => showFoto(viewIdx + 1));
viewer.addEventListener('keydown', e => {
  if (viewFotos.length < 2 || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
  e.preventDefault(); showFoto(viewIdx + (e.key === 'ArrowRight' ? 1 : -1));
});
// Deslizar a foto para os lados troca de foto
let fotoTouch = null;
$('viewerPhoto').addEventListener('touchstart', e => {
  fotoTouch = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
}, { passive: true });
$('viewerPhoto').addEventListener('touchend', e => {
  if (!fotoTouch || viewFotos.length < 2) return;
  const t = e.changedTouches[0], dx = t.clientX - fotoTouch.x, dy = t.clientY - fotoTouch.y;
  fotoTouch = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.2) showFoto(viewIdx + (dx < 0 ? 1 : -1));
}, { passive: true });
$('viewerPick').addEventListener('click', () => {
  if (!state.picked.delete(viewing)) state.picked.add(viewing);
  renderList(); renderCta(); renderViewer();
});
$('viewerClose').addEventListener('click', () => viewer.close());
viewer.addEventListener('click', e => { if (e.target === viewer) viewer.close(); });
// A lista foi redesenhada por baixo: devolve o foco à foto que abriu
viewer.addEventListener('close', () => {
  layerClosed('viewer');
  const el = viewing && $('list').querySelector(`[data-zoom="${CSS.escape(viewing)}"]`);
  if (el && !$('list').contains(document.activeElement)) el.focus({ preventScroll: true });
});
function toggleOpen(b) {
  const key = b.dataset.open;
  if (!state.open.delete(key)) state.open.add(key);
  refresh(`[data-open="${CSS.escape(key)}"]`);
}
$('list').addEventListener('click', e => {
  const z = e.target.closest('[data-zoom]');
  if (z) { openViewer(z.dataset.zoom); return; }
  const el = e.target.closest('[data-key]');
  if (el) { togglePick(el); return; }
  const b = e.target.closest('[data-open]'); if (b) toggleOpen(b);
});
// Os + são botões de verdade; só as linhas de sabor dos doces precisam do teclado aqui
$('list').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  if (!e.target.matches('.flv[data-key]')) return;
  e.preventDefault(); togglePick(e.target);
});
$('filters').addEventListener('click', e => {
  const b = e.target.closest('[data-filter]'); if (!b) return;
  state.filter = b.dataset.filter; renderFilters(); renderList();
});

// ---- Voltar do celular ----
// Bolos é a página inicial. Tortas e Doces, a foto ampliada e o pedido ganham um passo no histórico:
// o "voltar" fecha a foto ou o pedido, depois volta para Bolos e só então sai do cardápio.
function tabHistory(id) {
  const s = history.state || {};
  if (s.home) { if (id !== MENU[0].id) history.pushState({ tab: id }, ''); }
  else if (id === MENU[0].id) history.back();
  else history.replaceState({ tab: id }, '');
}
function layerOpened(layer) { history.pushState({ tab: state.tab, layer }, ''); }
// Fechou pelo X, pelo fundo ou pelo Esc: tira o passo que a abertura pôs
function layerClosed(layer) { if (history.state && history.state.layer === layer) history.back(); }
function syncTab() {
  if (busy) { setTimeout(syncTab, 520); return; }
  const s = history.state, want = (s && s.tab) || MENU[0].id;
  if (want !== state.tab) goTo(MENU.findIndex(c => c.id === want), 0, true);
}
addEventListener('popstate', () => {
  const layer = history.state && history.state.layer;
  if (cart.open && layer !== 'cart') cart.close();
  if (viewer.open && layer !== 'viewer') viewer.close();
  syncTab();
});
// Ao recarregar a página, continua na aba em que a pessoa estava
const hs = history.state;
if (!hs) history.replaceState({ home: true, tab: MENU[0].id }, '');
else {
  if (MENU.some(c => c.id === hs.tab)) state.tab = hs.tab;
  if (hs.layer) history.replaceState({ tab: hs.tab }, '');
}

load();
render();

// Abertura: some sozinha depois da animação ou com um toque
const splash = $('splash');
splash.addEventListener('click', () => splash.classList.add('skip'));
splash.addEventListener('animationend', e => { if (e.target === splash) splash.remove(); });

// Usa o logo (variável --logo do CSS) como ícone da aba sem duplicar a imagem no arquivo
const logoUrl = (getComputedStyle(document.documentElement).getPropertyValue('--logo').match(/url\(["']?(.*?)["']?\)/) || [])[1];
if (logoUrl) { const ico = document.createElement('link'); ico.rel = 'icon'; ico.href = logoUrl; document.head.appendChild(ico); }
</script>
</body>
